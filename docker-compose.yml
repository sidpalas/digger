services:
  postgres:
    image: postgres:alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=root
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile_backend
      args:
        COMMIT_SHA: local
    env_file:
      - backend/.env
    environment:
      - DATABASE_URL=postgres://postgres:root@postgres:5432/postgres?sslmode=disable
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  statesman:
    build:
      context: taco
      dockerfile: Dockerfile_statesman
      args:
        COMMIT_SHA: local
    env_file:
      - taco/.env
    ports:
      - "8080:8080"
    volumes:
      - statesman-data:/app/data
    depends_on:
      - minio

  ui:
    build:
      context: .
      dockerfile: Dockerfile_ui
      args:
        COMMIT_SHA: local
    env_file:
      - ui/.env.local
    environment:
      - ORCHESTRATOR_BACKEND_URL=http://backend:3000
      - STATESMAN_BACKEND_URL=http://statesman:8080
      - PUBLIC_URL=https://hyperphysical-alyse-metagnathous.ngrok-free.dev
      - ALLOWED_HOSTS=localhost,127.0.0.1
    ports:
      - "3030:3030"
    depends_on:
      - backend
      - statesman
      - token-service

  token-service:
    build:
      context: taco
      dockerfile: Dockerfile_token_service
      args:
        COMMIT_SHA: local
    ports:
      - "8081:8081"
    volumes:
      - token-service-data:/app/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - |
        # Wait for MinIO to accept connections before creating buckets.
        i=0
        until mc alias set local http://minio:9000 minioadmin minioadmin; do
          i=$$((i+1))
          if [ $$i -ge 60 ]; then
            echo 'MinIO not ready after 60s'
            exit 1
          fi
          sleep 1
        done
        mc mb -p local/opentaco || true

volumes:
  statesman-data:
    driver: local
  minio-data:
    driver: local
  token-service-data:
    driver: local
